id = "shadk.tab-numbers"
name = "Tab Numbers"
version = "0.3.0"
min_herdr_version = "0.9.3"
description = "Number tabs by position and show workspace and agent positions in the sidebar"
platforms = ["linux", "macos"]

[[startup]]
command = ["bash", "renumber.sh"]

[[events]]
on = "tab.created"
command = ["bash", "renumber.sh"]

[[events]]
on = "tab.closed"
command = ["bash", "renumber.sh"]

[[events]]
on = "tab.moved"
command = ["bash", "renumber.sh"]

[[events]]
on = "tab.renamed"
command = ["bash", "renumber.sh"]

[[events]]
on = "workspace.created"
command = ["bash", "renumber.sh"]

[[events]]
on = "workspace.closed"
command = ["bash", "renumber.sh"]

[[events]]
on = "workspace.moved"
command = ["bash", "renumber.sh"]

[[events]]
on = "workspace.reordered"
command = ["bash", "renumber.sh"]

[[events]]
on = "pane.agent_detected"
command = ["bash", "renumber.sh"]

[[events]]
on = "pane.agent_status_changed"
command = ["bash", "renumber.sh"]

[[events]]
on = "pane.exited"
command = ["bash", "renumber.sh"]

[[events]]
on = "pane.closed"
command = ["bash", "renumber.sh"]

[[events]]
on = "pane.moved"
command = ["bash", "renumber.sh"]
