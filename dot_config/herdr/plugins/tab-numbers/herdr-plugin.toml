id = "shadk.tab-numbers"
name = "Tab Numbers"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Prefix every tab label with its position, e.g. \"2: ssh: mediaserver\""
platforms = ["linux", "macos"]

[[startup]]
command = ["bash", "renumber.sh"]

[[events]]
on = "tab.created"
command = ["bash", "renumber.sh"]

[[events]]
on = "tab.closed"
command = ["bash", "renumber.sh"]

[[events]]
on = "tab.moved"
command = ["bash", "renumber.sh"]

[[events]]
on = "tab.renamed"
command = ["bash", "renumber.sh"]

[[events]]
on = "workspace.created"
command = ["bash", "renumber.sh"]
